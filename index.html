      <!-- Apply the saved theme before first paint so dark mode never flashes light. -->
      <script>
        (function () {
          try {
            var pref = localStorage.getItem('cluelux_theme');
            var dark = pref === 'dark' || ((pref === 'system' || !pref) && window.matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.classList.toggle('dark', dark);
            document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
          } catch (e) {}
        })();
      </script>
